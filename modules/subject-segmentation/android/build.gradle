apply plugin: 'com.android.library'

group = 'expo.modules.subjectsegmentation'
version = '1.0.0'

// Plantilla de módulos locales de Expo (SDK 51-53). Si tu SDK es otro, genera uno vacío con
// `npx create-expo-module@latest --local` y copia SOLO la sección `dependencies` y el código Kotlin.
def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

android {
  namespace "expo.modules.subjectsegmentation"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions { abortOnError false }
}

dependencies {
  // ML Kit Subject Segmentation (beta, el modelo lo descarga Google Play services). Requiere minSdk 24.
  implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'
  implementation 'com.google.android.gms:play-services-base:18.5.0'
}
